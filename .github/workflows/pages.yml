name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Allows other repositories (e.g. the dialog or aamachine source repos) to force
  # a rebuild/redeploy of the published manual by sending a repository_dispatch event
  # of this type. See "Triggering a rebuild from another repository" in README.md.
  repository_dispatch:
    types: [rebuild-manual]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Antora
      run: npm install antora

    - name: Generate Site
      run: npx antora antora-playbook.yml

    - name: Upload Artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
